build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 6
  ComplexInterface:
    active: true
    threshold: 25
  CyclomaticComplexMethod:
    active: true
    threshold: 25 # Increased for UI logic
  LargeClass:
    active: true
    threshold: 600
  LongMethod:
    active: true
    threshold: 150 # Increased for long Compose layouts
  LongParameterList:
    active: true
    functionThreshold: 15
    constructorThreshold: 15
  MethodOverloading:
    active: true
    threshold: 6
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 40
    thresholdInClasses: 30
    thresholdInInterfaces: 30
    thresholdInEnums: 30

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|.*Preview.*|.*Test.*)'
  ThrowsCount:
    active: true
    max: 2
  NewLineAtEndOfFile:
    active: false # Handled by ktlint

comments:
  active: true
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false

naming:
  active: true
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*' # Allow PascalCase for Composables
  ClassNaming:
    active: true
  VariableNaming:
    active: true
  PackageNaming:
    active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - Error
      - Throwable
      - RuntimeException
      - NullPointerException
      - IndexOutOfBoundsException
  PrintStackTrace:
    active: true
